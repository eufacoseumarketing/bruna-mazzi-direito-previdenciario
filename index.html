<script>
(function(){
  function clickPescaChatFab() {
    var host = document.getElementById('pesca-chat-host');
    if (host && host.shadowRoot) {
      var fab = host.shadowRoot.querySelector('.fab, [class*="fab"]');
      if (fab) { fab.click(); return true; }
    }
    return false;
  }
  function attach() {
    document.querySelectorAll('.pescachat').forEach(function(el) {
      if (el.dataset.pcClick) return;
      el.dataset.pcClick = '1';
      el.style.cursor = 'pointer';
      el.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (!clickPescaChatFab()) {
          setTimeout(function() { clickPescaChatFab(); }, 300);
        }
      });
    });
  }
  attach();
  new MutationObserver(function() { attach(); }).observe(document.body, { childList: true, subtree: true });
})();
</script>
